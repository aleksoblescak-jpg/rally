# Builds Rally for Mac (Apple Silicon + Intel) and Windows on GitHub's servers.
# Run it from the repository's Actions tab ("Build Rally" → Run workflow), or push a tag like v1.0.0.
# The installers appear as a draft release on the repository's Releases page.
name: Build Rally

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Rally v__VERSION__
          releaseBody: Download the file for your computer below.
          releaseDraft: true
          args: ${{ matrix.args }}
